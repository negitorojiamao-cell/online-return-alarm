name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: dotnet publish .\src\OnlineReturnAlarm\OnlineReturnAlarm.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output .\publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: online-return-alarm-win-x64
          path: publish/OnlineReturnAlarm.exe
          if-no-files-found: error
          retention-days: 30
